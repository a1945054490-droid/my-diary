<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>我的日记</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2ff; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        
        /* 夜间模式 */
        body.dark { background: #1a1a1a; color: #d4d4d4; }
        body.dark .diary-card { background: #2a2a2a; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        body.dark .diary-card p { color: #c8c8c8 !important; }
        body.dark .diary-card .date-text { color: #999 !important; }
        body.dark .header { background: linear-gradient(135deg, #4a1d96, #312e81); }
        body.dark .tab-bar { background: #1f1f1f; border-bottom-color: #333; }
        body.dark .tab { color: #888; }
        body.dark .tab.active { color: #a78bfa; border-bottom-color: #a78bfa; }
        body.dark .modal-content { background: #2a2a2a; color: #d4d4d4; }
        body.dark .modal-content h2 { color: #e0e0e0; }
        body.dark .modal-content p { color: #999 !important; }
        body.dark textarea { background: #333; border-color: #444; color: #d4d4d4; }
        body.dark textarea:focus { border-color: #7c3aed; }
        body.dark .mood-btn { background: #333; border-color: #444; }
        body.dark .mood-btn.selected { border-color: #7c3aed; background: #3d2a5c; }
        body.dark .popup-menu { background: #333; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
        body.dark .popup-menu-item { color: #d4d4d4; }
        body.dark .popup-menu-item:hover { background: #3a3a3a; }
        body.dark .popup-menu-item:not(:last-child) { border-bottom-color: #444; }
        body.dark .popup-menu-item.danger { color: #f87171; }
        body.dark .more-btn { color: #777; }
        body.dark .more-btn:hover { background: #3a3a3a; color: #aaa; }
        body.dark .empty-state { color: #666; }
        body.dark .cancel-btn { border-color: #444; color: #d4d4d4; }
        body.dark .trash-info { color: #666 !important; }
        body.dark .trash-empty-btn { background: #3a2020; color: #f87171; }
        body.dark .restore-btn { background: #1a3a2a; color: #6ee7b7; }
        body.dark .perm-delete-btn { background: #3a2020; color: #f87171; }
        body.dark .days-left { color: #666 !important; }

        .diary-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; position: relative; transition: transform 0.1s, background 0.3s, box-shadow 0.3s; }
        .diary-card:active { transform: scale(0.98); }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; font-size: 32px; border: none; box-shadow: 0 4px 15px rgba(124,58,237,0.4); cursor: pointer; z-index: 100; display: flex; align-items: center; justify-content: center; }
        .fab:hover { transform: scale(1.1); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 20px; padding: 24px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; transition: background 0.3s, color 0.3s; }
        .mood-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #e5e7eb; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; background: white; transition: background 0.3s, border-color 0.3s; }
        .mood-btn.selected { border-color: #7c3aed; background: #f3e8ff; }
        textarea { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; font-size: 16px; resize: none; outline: none; min-height: 150px; transition: background 0.3s, border-color 0.3s, color 0.3s; }
        textarea:focus { border-color: #7c3aed; }
        .save-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 12px; }
        .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; transition: background 0.3s; }
        .header h1 { font-size: 20px; font-weight: 600; }
        .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .action-btn { font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 6px; border: none; }
        .restore-btn { color: #10b981; background: #ecfdf5; }
        .perm-delete-btn { color: #ef4444; background: #fef2f2; }
        .tab-bar { display: flex; background: white; border-bottom: 1px solid #e5e7eb; position: sticky; top: 56px; z-index: 9; transition: background 0.3s, border-color 0.3s; }
        .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; cursor: pointer; color: #6b7280; border-bottom: 2px solid transparent; transition: color 0.3s; }
        .tab.active { color: #7c3aed; border-bottom-color: #7c3aed; font-weight: 600; }
        .badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 4px; }

        .more-btn { 
            background: none; 
            border: none; 
            font-size: 18px; 
            color: #9ca3af; 
            cursor: pointer; 
            padding: 4px 8px; 
            border-radius: 8px;
            letter-spacing: 2px;
            transition: background 0.2s, color 0.2s;
        }
        .more-btn:hover { background: #f3f4f6; color: #6b7280; }

        .popup-menu {
            display: none;
            position: absolute;
            bottom: 45px;
            right: 12px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            z-index: 50;
            min-width: 120px;
            animation: popIn 0.15s ease;
            transition: background 0.3s;
        }
        .popup-menu.show { display: block; }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .popup-menu-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            transition: background 0.1s;
            color: #374151;
        }
        .popup-menu-item:hover { background: #f9fafb; }
        .popup-menu-item:not(:last-child) { border-bottom: 1px solid #f3f4f6; }
        .popup-menu-item.danger { color: #ef4444; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; }
        .overlay.show { display: block; }

        /* 夜间模式切换按钮 */
        .theme-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="header">
        <div style="width:36px;"></div>
        <h1>我的日记</h1>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="tab-bar">
        <div class="tab active" id="tab-diary" onclick="switchTab('diary')">📝 日记</div>
        <div class="tab" id="tab-trash" onclick="switchTab('trash')">🗑️ 回收站 <span class="badge" id="trash-badge" style="display:none;">0</span></div>
    </div>

    <div id="diary-page" style="padding: 16px;">
        <div id="diary-list"></div>
    </div>

    <div id="trash-page" style="padding: 16px; display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <p class="trash-info" style="font-size:13px; color:#9ca3af;">删除的日记将保留30天</p>
            <button class="trash-empty-btn" onclick="emptyTrash()" style="font-size:12px; color:#ef4444; background:#fef2f2; border:none; padding:6px 12px; border-radius:8px; cursor:pointer;">清空回收站</button>
        </div>
        <div id="trash-list"></div>
    </div>

    <button class="fab" id="fab-btn" onclick="openModal()">+</button>

    <div class="overlay" id="overlay" onclick="closeAllMenus()"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 style="font-size:18px; font-weight:600; margin-bottom:16px;" id="modal-title">写日记</h2>
            <p style="font-size:14px; color:#6b7280; margin-bottom:8px;">今天心情如何？</p>
            <div style="display:flex; gap:10px; margin-bottom:16px;" id="mood-selector">
                <button class="mood-btn" onclick="selectMood(this, '😊')">😊</button>
                <button class="mood-btn" onclick="selectMood(this, '😢')">😢</button>
                <button class="mood-btn" onclick="selectMood(this, '😡')">😡</button>
                <button class="mood-btn" onclick="selectMood(this, '😴')">😴</button>
                <button class="mood-btn" onclick="selectMood(this, '🥰')">🥰</button>
                <button class="mood-btn" onclick="selectMood(this, '😎')">😎</button>
            </div>
            <textarea id="diary-content" placeholder="今天发生了什么..."></textarea>
            <button class="save-btn" id="save-btn" onclick="saveDiary()">保存日记</button>
            <button class="cancel-btn" style="width:100%; padding:14px; background:none; border:1px solid #e5e7eb; border-radius:12px; font-size:16px; cursor:pointer; margin-top:8px;" onclick="closeModal()">取消</button>
        </div>
    </div>

    <script>
        var selectedMood = '';
        var currentTab = 'diary';
        var editingId = null;

        // 主题切换
        function toggleTheme() {
            var isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-toggle').textContent = isDark ? '☀️' : '🌙';
        }

        function loadTheme() {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('theme-toggle').textContent = '☀️';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-diary').classList.toggle('active', tab === 'diary');
            document.getElementById('tab-trash').classList.toggle('active', tab === 'trash');
            document.getElementById('diary-page').style.display = tab === 'diary' ? 'block' : 'none';
            document.getElementById('trash-page').style.display = tab === 'trash' ? 'block' : 'none';
            document.getElementById('fab-btn').style.display = tab === 'diary' ? 'flex' : 'none';
            if (tab === 'trash') renderTrash();
        }

        function openModal() {
            editingId = null;
            document.getElementById('modal-title').textContent = '写日记';
            document.getElementById('save-btn').textContent = '保存日记';
            document.getElementById('modal').classList.add('active');
            selectedMood = '';
            document.getElementById('diary-content').value = '';
            var btns = document.querySelectorAll('.mood-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('selected');
            }
        }

        function openEditModal(id) {
            closeAllMenus();
            var diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
            var item = null;
            for (var i = 0; i < diaries.length; i++) {
                if (diaries[i].id === id) {
                    item = diaries[i];
                    break;
                }
            }
            if (!item) return;

            editingId = id;
            document.getElementById('modal-title').textContent = '编辑日记';
            document.getElementById('save-btn').textContent = '保存修改';
            document.getElementById('modal').classList.add('active');
            document.getElementById('diary-content').value = item.content;
            selectedMood = item.mood;

            var btns = document.querySelectorAll('.mood-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('selected');
                if (btns[i].textContent === item.mood) {
                    btns[i].classList.add('selected');
                }
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            editingId = null;
        }

        function selectMood(btn, mood) {
            selectedMood = mood;
            var btns = document.querySelectorAll('.mood-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('selected');
            }
            btn.classList.add('selected');
        }

        function saveDiary() {
            var content = document.getElementById('diary-content').value.trim();
            if (!content) {
                alert('请写点什么吧~');
                return;
            }

            var diaries = JSON.parse(localStorage.getItem('diaries') || '[]');

            if (editingId) {
                for (var i = 0; i < diaries.length; i++) {
                    if (diaries[i].id === editingId) {
                        diaries[i].content = content;
                        diaries[i].mood = selectedMood || diaries[i].mood;
                        break;
                    }
                }
            } else {
                var now = new Date();
                var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
                var timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
                var entry = {
                    id: Date.now(),
                    date: dateStr,
                    time: timeStr,
                    mood: selectedMood || '😊',
                    content: content
                };
                diaries.unshift(entry);
            }

            localStorage.setItem('diaries', JSON.stringify(diaries));
            closeModal();
            renderDiaries();
        }

        function toggleMenu(e, id) {
            e.stopPropagation();
            closeAllMenus();
            var menu = document.getElementById('menu-' + id);
            menu.classList.add('show');
            document.getElementById('overlay').classList.add('show');
        }

        function closeAllMenus() {
            var menus = document.querySelectorAll('.popup-menu');
            for (var i = 0; i < menus.length; i++) {
                menus[i].classList.remove('show');
            }
            document.getElementById('overlay').classList.remove('show');
        }

        function deleteDiary(e, id) {
            e.stopPropagation();
            closeAllMenus();
            if (!confirm('移入回收站？')) return;
            var diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
            var trash = JSON.parse(localStorage.getItem('trash') || '[]');
            var item = null;
            for (var i = 0; i < diaries.length; i++) {
                if (diaries[i].id === id) {
                    item = diaries[i];
                    break;
                }
            }
            if (item) {
                item.deletedAt = Date.now();
                trash.unshift(item);
                localStorage.setItem('trash', JSON.stringify(trash));
            }
            diaries = diaries.filter(function(d) { return d.id !== id; });
            localStorage.setItem('diaries', JSON.stringify(diaries));
            renderDiaries();
            updateTrashBadge();
        }

        function restoreDiary(id) {
            var trash = JSON.parse(localStorage.getItem('trash') || '[]');
            var diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
            var item = null;
            for (var i = 0; i < trash.length; i++) {
                if (trash[i].id === id) {
                    item = trash[i];
                    break;
                }
            }
            if (item) {
                delete item.deletedAt;
                diaries.unshift(item);
                localStorage.setItem('diaries', JSON.stringify(diaries));
            }
            trash = trash.filter(function(d) { return d.id !== id; });
            localStorage.setItem('trash', JSON.stringify(trash));
            renderTrash();
            updateTrashBadge();
        }

        function permDelete(id) {
            if (!confirm('永久删除？此操作不可恢复！')) return;
            var trash = JSON.parse(localStorage.getItem('trash') || '[]');
            trash = trash.filter(function(d) { return d.id !== id; });
            localStorage.setItem('trash', JSON.stringify(trash));
            renderTrash();
            updateTrashBadge();
        }

        function emptyTrash() {
            if (!confirm('确定清空回收站？所有日记将永久删除！')) return;
            localStorage.setItem('trash', '[]');
            renderTrash();
            updateTrashBadge();
        }

        function autoCleanTrash() {
            var trash = JSON.parse(localStorage.getItem('trash') || '[]');
            var now = Date.now();
            var days30 = 30 * 24 * 60 * 60 * 1000;
            trash = trash.filter(function(d) { return (now - d.deletedAt) < days30; });
            localStorage.setItem('trash', JSON.stringify(trash));
        }

        function updateTrashBadge() {
            var trash = JSON.parse(localStorage.getItem('trash') || '[]');
            var badge = document.getElementById('trash-badge');
            if (trash.length > 0) {
                badge.style.display = 'inline';
                badge.textContent = trash.length;
            } else {
                badge.style.display = 'none';
            }
        }

        function renderDiaries() {
            var diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
            var list = document.getElementById('diary-list');
            if (diaries.length === 0) {
                list.innerHTML = '<div class="empty-state"><p style="font-size:48px; margin-bottom:16px;">📝</p><p style="font-size:16px;">还没有日记</p><p style="font-size:14px; margin-top:8px;">点击右下角 + 开始写第一篇吧</p></div>';
                return;
            }
            var html = '';
            for (var i = 0; i < diaries.length; i++) {
                var d = diaries[i];
                html += '<div class="diary-card" onclick="openEditModal(' + d.id + ')">';
                html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">';
                html += '<span class="date-text" style="font-size:14px; color:#6b7280;">' + d.date + ' ' + d.time + '</span>';
                html += '<span style="font-size:20px;">' + d.mood + '</span>';
                html += '</div>';
                html += '<p style="font-size:15px; line-height:1.6; color:#374151; white-space:pre-wrap;">' + d.content + '</p>';
                html += '<div style="display:flex; justify-content:flex-end; margin-top:10px; position:relative;">';
                html += '<button class="more-btn" onclick="toggleMenu(event,' + d.id + ')">•••</button>';
                html += '<div class="popup-menu" id="menu-' + d.id + '">';
                html += '<button class="popup-menu-item" onclick="event.stopPropagation(); closeAllMenus(); openEditModal(' + d.id + ')">编辑</button>';
                html += '<button class="popup-menu-item danger" onclick="deleteDiary(event,' + d.id + ')">删除</button>';
                html += '</div>';
                html += '</div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function renderTrash() {
            var trash = JSON.parse(localStorage.getItem('trash') || '[]');
            var list = document.getElementById('trash-list');
            if (trash.length === 0) {
                list.innerHTML = '<div class="empty-state"><p style="font-size:48px; margin-bottom:16px;">🗑️</p><p style="font-size:16px;">回收站是空的</p></div>';
                return;
            }
            var html = '';
            for (var i = 0; i < trash.length; i++) {
                var d = trash[i];
                var daysLeft = 30 - Math.floor((Date.now() - d.deletedAt) / (24*60*60*1000));
                html += '<div class="diary-card" style="opacity:0.8; cursor:default;">';
                html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">';
                html += '<span class="date-text" style="font-size:14px; color:#6b7280;">' + d.date + ' ' + d.time + ' ' + d.mood + '</span>';
                html += '<span class="days-left" style="font-size:11px; color:#9ca3af;">' + daysLeft + '天后自动删除</span>';
                html += '</div>';
                html += '<p style="font-size:15px; line-height:1.6; color:#374151; margin-bottom:10px; white-space:pre-wrap;">' + d.content + '</p>';
                html += '<div style="display:flex; gap:8px; justify-content:flex-end;">';
                html += '<button class="action-btn restore-btn" onclick="restoreDiary(' + d.id + ')">↩️ 恢复</button>';
                html += '<button class="action-btn perm-delete-btn" onclick="permDelete(' + d.id + ')">永久删除</button>';
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

        loadTheme();
        autoCleanTrash();
        renderDiaries();
        updateTrashBadge();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
