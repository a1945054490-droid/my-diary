<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7c3aed">
    <title>我的日记</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @media (display-mode: standalone) { body { padding-top: env(safe-area-inset-top); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app"></div>
    <script>
    function loadEntries() {
        try {
            const data = localStorage.getItem('diary_entries');
            return data ? JSON.parse(data) : [
                { id: 1, date: '2026-05-25', title: '美好的一天', content: '今天天气很好，出去散步了一会儿，感觉心情很愉快。', mood: '😊' },
                { id: 2, date: '2026-05-24', title: '读完了一本书', content: '终于把那本小说读完了，结局让我很感动。', mood: '📖' }
            ];
        } catch (e) { return []; }
    }
    function saveEntries(entries) { try { localStorage.setItem('diary_entries', JSON.stringify(entries)); } catch(e) {} }

    let entries = loadEntries();
    let currentView = 'list';
    let selectedEntry = null;
    let searchTerm = '';
    const moods = ['😊', '😢', '😡', '🥰', '😴', '🤔', '🎉', '📖', '🏃', '🌧️'];

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }
    function getTodayStr() { return new Date().toISOString().split('T')[0]; }

    function render() {
        const app = document.getElementById('app');
        switch(currentView) {
            case 'list': app.innerHTML = renderList(); break;
            case 'detail': app.innerHTML = renderDetail(); break;
            case 'create': app.innerHTML = renderForm('create'); break;
            case 'edit': app.innerHTML = renderForm('edit'); break;
        }
        bindEvents();
    }

    function renderHeader(showAdd, showBack) {
        return \`<div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 shadow-lg sticky top-0 z-10">
            <div class="flex items-center justify-between max-w-lg mx-auto">
                <div class="flex items-center gap-2 cursor-pointer" id="btn-home">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <h1 class="text-xl font-bold">我的日记</h1>
                </div>
                \${showAdd ? '<button id="btn-create" class="bg-white text-purple-600 px-4 py-2 rounded-full font-semibold text-sm flex items-center gap-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>写日记</button>' : ''}
                \${showBack ? '<button id="btn-back" class="bg-white bg-opacity-20 text-white px-4 py-2 rounded-full font-semibold text-sm">返回</button>' : ''}
            </div></div>\`;
    }

    function renderList() {
        const filtered = entries.filter(e => e.title.toLowerCase().includes(searchTerm.toLowerCase()) || e.content.toLowerCase().includes(searchTerm.toLowerCase()));
        const entriesHtml = filtered.length === 0
            ? '<div class="text-center py-12 text-gray-400"><p>' + (searchTerm ? '没有找到相关日记' : '还没有日记，开始写第一篇吧！') + '</p></div>'
            : filtered.map(entry => \`<div class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm entry-card" data-id="\${entry.id}">
                <div class="flex items-start justify-between">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1"><span class="text-lg">\${entry.mood}</span><h3 class="font-semibold text-gray-800 truncate">\${entry.title}</h3></div>
                        <p class="text-sm text-gray-500 mb-2">\${formatDate(entry.date)}</p>
                        <p class="text-sm text-gray-600 line-clamp-2">\${entry.content}</p>
                    </div>
                    <div class="flex gap-1 ml-2 flex-shrink-0">
                        <button class="p-2 text-gray-400 btn-edit" data-id="\${entry.id}">✏️</button>
                        <button class="p-2 text-gray-400 btn-delete" data-id="\${entry.id}">🗑️</button>
                    </div>
                </div></div>\`).join('');
        return \`\${renderHeader(true, false)}
        <div class="p-4 max-w-lg mx-auto space-y-4">
            <div class="relative">
                <input type="text" id="search-input" placeholder="🔍 搜索日记..." value="\${searchTerm}" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-300 bg-white">
            </div>
            <div class="bg-purple-50 rounded-xl p-3 flex items-center justify-between">
                <span class="text-purple-700 text-sm font-medium">共 \${entries.length} 篇日记</span>
            </div>
            <div class="space-y-3">\${entriesHtml}</div>
        </div>\`;
    }

    function renderDetail() {
        if (!selectedEntry) return '';
        return \`\${renderHeader(false, true)}
        <div class="p-4 max-w-lg mx-auto">
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-3xl">\${selectedEntry.mood}</span>
                    <div><h2 class="text-xl font-bold text-gray-800">\${selectedEntry.title}</h2>
                    <p class="text-sm text-gray-500">\${formatDate(selectedEntry.date)}</p></div>
                </div>
                <hr class="my-4 border-gray-100">
                <p class="text-gray-700 leading-relaxed whitespace-pre-wrap">\${selectedEntry.content}</p>
                <div class="mt-6 flex gap-2">
                    <button id="btn-edit-detail" class="px-4 py-2 bg-purple-100 text-purple-700 rounded-lg text-sm font-medium">✏️ 编辑</button>
                    <button id="btn-delete-detail" class="px-4 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-medium">🗑️ 删除</button>
                </div>
            </div></div>\`;
    }

    function renderForm(mode) {
        const title = mode === 'create' ? '' : (selectedEntry?.title || '');
        const content = mode === 'create' ? '' : (selectedEntry?.content || '');
        const date = mode === 'create' ? getTodayStr() : (selectedEntry?.date || getTodayStr());
        const mood = mode === 'create' ? '😊' : (selectedEntry?.mood || '😊');
        const moodBtns = moods.map(m => '<button class="mood-btn text-2xl p-2 rounded-lg ' + (m === mood ? 'bg-purple-100 ring-2 ring-purple-400' : '') + '" data-mood="' + m + '">' + m + '</button>').join('');
        return \`\${renderHeader(false, true)}
        <div class="p-4 max-w-lg mx-auto">
            <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 space-y-4">
                <h2 class="text-lg font-bold text-gray-800">\${mode === 'create' ? '✍️ 写新日记' : '📝 编辑日记'}</h2>
                <div><label class="block text-sm font-medium text-gray-600 mb-1">日期</label>
                <input type="date" id="form-date" value="\${date}" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-300"></div>
                <div><label class="block text-sm font-medium text-gray-600 mb-2">心情</label>
                <div class="flex flex-wrap gap-2" id="mood-picker">\${moodBtns}</div>
                <input type="hidden" id="form-mood" value="\${mood}"></div>
                <div><label class="block text-sm font-medium text-gray-600 mb-1">标题</label>
                <input type="text" id="form-title" value="\${title}" placeholder="给今天起个标题吧..." class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-300"></div>
                <div><label class="block text-sm font-medium text-gray-600 mb-1">内容</label>
                <textarea id="form-content" placeholder="今天发生了什么..." rows="8" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-300 resize-none">\${content}</textarea></div>
                <div class="flex gap-3 pt-2">
                    <button id="btn-save" class="flex-1 bg-purple-600 text-white py-3 rounded-lg font-semibold">💾 保存</button>
                    <button id="btn-cancel" class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-lg font-semibold">取消</button>
                </div>
            </div></div>\`;
    }

    function bindEvents() {
        document.getElementById('btn-home')?.addEventListener('click', () => { currentView = 'list'; render(); });
        document.getElementById('btn-back')?.addEventListener('click', () => { currentView = 'list'; render(); });
        document.getElementById('btn-create')?.addEventListener('click', () => { selectedEntry = null; currentView = 'create'; render(); });
        document.getElementById('search-input')?.addEventListener('input', (e) => { searchTerm = e.target.value; render(); document.getElementById('search-input')?.focus(); });
        document.querySelectorAll('.entry-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.closest('.btn-edit') || e.target.closest('.btn-delete')) return;
                selectedEntry = entries.find(en => en.id === parseInt(card.dataset.id));
                currentView = 'detail'; render();
            });
        });
        document.querySelectorAll('.btn-edit').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); selectedEntry = entries.find(en => en.id === parseInt(btn.dataset.id)); currentView = 'edit'; render(); });
        });
        document.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); entries = entries.filter(en => en.id !== parseInt(btn.dataset.id)); saveEntries(entries); render(); });
        });
        document.getElementById('btn-edit-detail')?.addEventListener('click', () => { currentView = 'edit'; render(); });
        document.getElementById('btn-delete-detail')?.addEventListener('click', () => { entries = entries.filter(en => en.id !== selectedEntry.id); saveEntries(entries); currentView = 'list'; render(); });
        document.querySelectorAll('.mood-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('form-mood').value = btn.dataset.mood;
                document.querySelectorAll('.mood-btn').forEach(b => { b.className = 'mood-btn text-2xl p-2 rounded-lg ' + (b.dataset.mood === btn.dataset.mood ? 'bg-purple-100 ring-2 ring-purple-400' : ''); });
            });
        });
        document.getElementById('btn-save')?.addEventListener('click', () => {
            const title = document.getElementById('form-title').value.trim();
            const content = document.getElementById('form-content').value.trim();
            const date = document.getElementById('form-date').value;
            const mood = document.getElementById('form-mood').value;
            if (!title || !content) return;
            if (currentView === 'create') { entries.unshift({ id: Date.now(), date, title, content, mood }); }
            else { entries = entries.map(e => e.id === selectedEntry.id ? { ...e, title, content, date, mood } : e); }
            saveEntries(entries); currentView = 'list'; render();
        });
        document.getElementById('btn-cancel')?.addEventListener('click', () => { currentView = 'list'; render(); });
    }

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
    render();
    </script>
</body>
</html>
