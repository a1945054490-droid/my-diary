<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>我的日记</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2ff; min-height: 100vh; }
        .diary-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; font-size: 32px; border: none; box-shadow: 0 4px 15px rgba(124,58,237,0.4); cursor: pointer; z-index: 100; display: flex; align-items: center; justify-content: center; }
        .fab:hover { transform: scale(1.1); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 20px; padding: 24px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .mood-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #e5e7eb; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .mood-btn.selected { border-color: #7c3aed; background: #f3e8ff; }
        textarea { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; font-size: 16px; resize: none; outline: none; min-height: 150px; }
        textarea:focus { border-color: #7c3aed; }
        .save-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 12px; }
        .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 10; }
        .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .delete-btn { color: #ef4444; font-size: 12px; cursor: pointer; float: right; }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="text-align:center; font-size:20px; font-weight:600;">我的日记</h1>
    </div>

    <div id="diary-list" style="padding: 16px;"></div>

    <button class="fab" onclick="openModal()">+</button>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 style="font-size:18px; font-weight:600; margin-bottom:16px;">写日记</h2>
            <p style="font-size:14px; color:#6b7280; margin-bottom:8px;">今天心情如何？</p>
            <div style="display:flex; gap:10px; margin-bottom:16px;" id="mood-selector">
                <button class="mood-btn" onclick="selectMood(this, '😊')">😊</button>
                <button class="mood-btn" onclick="selectMood(this, '😢')">😢</button>
                <button class="mood-btn" onclick="selectMood(this, '😡')">😡</button>
                <button class="mood-btn" onclick="selectMood(this, '😴')">😴</button>
                <button class="mood-btn" onclick="selectMood(this, '🥰')">🥰</button>
                <button class="mood-btn" onclick="selectMood(this, '😎')">😎</button>
            </div>
            <textarea id="diary-content" placeholder="今天发生了什么..."></textarea>
            <button class="save-btn" onclick="saveDiary()">保存日记</button>
            <button style="width:100%; padding:14px; background:none; border:1px solid #e5e7eb; border-radius:12px; font-size:16px; cursor:pointer; margin-top:8px;" onclick="closeModal()">取消</button>
        </div>
    </div>

    <script>
        var selectedMood = '';

        function openModal() {
            document.getElementById('modal').classList.add('active');
            selectedMood = '';
            document.getElementById('diary-content').value = '';
            var btns = document.querySelectorAll('.mood-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('selected');
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function selectMood(btn, mood) {
            selectedMood = mood;
            var btns = document.querySelectorAll('.mood-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('selected');
            }
            btn.classList.add('selected');
        }

        function saveDiary() {
            var content = document.getElementById('diary-content').value.trim();
            if (!content) {
                alert('请写点什么吧~');
                return;
            }
            var diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
            var now = new Date();
            var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
            var timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            var entry = {
                id: Date.now(),
                date: dateStr,
                time: timeStr,
                mood: selectedMood || '😊',
                content: content
            };
            diaries.unshift(entry);
            localStorage.setItem('diaries', JSON.stringify(diaries));
            closeModal();
            renderDiaries();
        }

        function deleteDiary(id) {
            if (!confirm('确定删除这篇日记吗？')) return;
            var diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
            diaries = diaries.filter(function(d) { return d.id !== id; });
            localStorage.setItem('diaries', JSON.stringify(diaries));
            renderDiaries();
        }

        function renderDiaries() {
            var diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
            var list = document.getElementById('diary-list');
            if (diaries.length === 0) {
                list.innerHTML = '<div class="empty-state"><p style="font-size:48px; margin-bottom:16px;">📝</p><p style="font-size:16px;">还没有日记</p><p style="font-size:14px; margin-top:8px;">点击右下角 + 开始写第一篇吧</p></div>';
                return;
            }
            var html = '';
            for (var i = 0; i < diaries.length; i++) {
                var d = diaries[i];
                html += '<div class="diary-card">';
                html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">';
                html += '<span style="font-size:14px; color:#6b7280;">' + d.date + ' ' + d.time + '</span>';
                html += '<span style="display:flex; align-items:center; gap:8px;">';
                html += '<span style="font-size:20px;">' + d.mood + '</span>';
                html += '<span class="delete-btn" onclick="deleteDiary(' + d.id + ')">删除</span>';
                html += '</span></div>';
                html += '<p style="font-size:15px; line-height:1.6; color:#374151;">' + d.content + '</p>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        renderDiaries();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
